[pytest]
# Rootdir is this directory, so the same config works on the host
# (pytest tests/worker) and inside the worker container (pytest /app/tests,
# where the package is already on PYTHONPATH=/app/src).
pythonpath = ../../worker/src
asyncio_mode = auto
markers =
    ffmpeg: requires ffmpeg/ffprobe on PATH (runs in the worker container)
