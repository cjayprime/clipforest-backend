# ClipForest backend stack.
#
# Containers are used only where they earn it: PostgreSQL, Redis, S3-compatible
# storage, and the Python media worker (FFmpeg + OpenCV + provider SDKs).
#
# The web app is a separate repo with its own deployment; nothing here builds or
# serves it. It reaches this stack over HTTP at API_INTERNAL_URL.
#
# Local development — infrastructure + worker in Docker, the API natively:
#   cp ../.env.example ../.env
#   docker compose --env-file ../.env up -d --build
#   cd ../api && npm run start:dev                                # API on :4000
#
# Production (adds the API and Caddy containers; PRD §17.1):
#   COMPOSE_PROFILES=apps docker compose --env-file ../.env up -d --build

name: clipforest

x-s3: &s3
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-clipforest}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-clipforest}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-clipforest-secret}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

x-core: &core
  DATABASE_URL: postgresql://${POSTGRES_USER:-clipforest}:${POSTGRES_PASSWORD:-clipforest}@postgres:5432/${POSTGRES_DB:-clipforest}
  REDIS_URL: redis://redis:6379
  QUEUE_PREFIX: clipforest
  EVENTS_CHANNEL: clipforest:events
  PIPELINE_VERSION: ${PIPELINE_VERSION:-2026-09-mvp1}
  ANALYSIS_VERSION: ${ANALYSIS_VERSION:-mvp1}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5368709120}
  MAX_VIDEO_DURATION_SEC: ${MAX_VIDEO_DURATION_SEC:-10800}

services:
  # ------------------------------------------------ always on: infrastructure
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clipforest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipforest}
      POSTGRES_DB: ${POSTGRES_DB:-clipforest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # BullMQ requires noeviction; AOF keeps queues across restarts.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  # ---------------------------------- always on: media worker (needs FFmpeg)
  worker:
    build: ../worker
    restart: unless-stopped
    environment:
      <<: [*core, *s3]
      S3_ENDPOINT: ${S3_ENDPOINT_INTERNAL:-http://minio:9000}
      SOURCE_READ_MODE: ${SOURCE_READ_MODE:-url}
      WORKER_QUEUES: ${WORKER_QUEUES:-video-ingest,transcription,analysis,render,cleanup}
      CONCURRENCY_RENDER: "1"
      CONCURRENCY_TRANSCRIPTION: ${CONCURRENCY_TRANSCRIPTION:-3}
      CONCURRENCY_ANALYSIS: ${CONCURRENCY_ANALYSIS:-6}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-auto}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5}
      LLM_EFFORT: ${LLM_EFFORT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DISK_MIN_FREE_BYTES: ${DISK_MIN_FREE_BYTES:-5368709120}
      X264_PRESET: ${X264_PRESET:-veryfast}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-3}
      RENDER_RETENTION_DAYS: ${RENDER_RETENTION_DAYS:-0}
      SOURCE_RETENTION_DAYS: ${SOURCE_RETENTION_DAYS:-0}
      LOG_LEVEL: ${WORKER_LOG_LEVEL:-INFO}
    volumes:
      - worker-tmp:/tmp/video-jobs
      # Read-only so the FFmpeg/OpenCV suites can run inside the container:
      #   docker compose run --rm --no-deps worker python -m pytest -q /app/tests
      - ../tests/worker:/app/tests:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      # Only present with the local-s3 profile; production points S3_* at Cloudflare R2.
      minio-init: { condition: service_completed_successfully, required: false }
    mem_limit: 3g
    cpus: ${WORKER_CPUS:-3}

  # ------------------------- profile local-s3: MinIO stands in for Cloudflare R2
  minio:
    image: minio/minio:latest
    profiles: ["local-s3"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-clipforest}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-clipforest-secret}
      # Browsers upload straight to storage, so every origin the app is served from must be allowed
      # (localhost and 127.0.0.1 are different origins — Playwright uses the latter).
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    mem_limit: 512m

  minio-init:
    image: minio/mc:latest
    profiles: ["local-s3"]
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-clipforest}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-clipforest-secret}
      S3_BUCKET: ${S3_BUCKET:-clipforest}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
        echo "bucket ready"

  # ------------------- profile apps: containerized API + proxy (production host)
  api:
    build: ../api
    profiles: ["apps"]
    restart: unless-stopped
    environment:
      <<: [*core, *s3]
      PORT: "4000"
      NODE_ENV: production
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me-0123456789abcdef}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      S3_ENDPOINT: ${S3_ENDPOINT_INTERNAL:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      MIN_CANDIDATE_SCORE: ${MIN_CANDIDATE_SCORE:-40}
      MULTIPART_THRESHOLD_BYTES: ${MULTIPART_THRESHOLD_BYTES:-67108864}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4000:4000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully, required: false }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m

  caddy:
    image: caddy:2.10-alpine
    profiles: ["apps"]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api]
    mem_limit: 128m

volumes:
  pgdata:
  redisdata:
  miniodata:
  worker-tmp:
  caddy-data:
